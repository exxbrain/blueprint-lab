name: Check

# Только проверка: задачи решаемы, сборка проходит. Сайт не публикуется.
# Чтобы снова выложить на GitHub Pages, верните шаги upload-pages-artifact и deploy-pages
# (см. историю этого файла, бывший pages.yml).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Проверка решаемости задач
        run: npm run check
      - name: Сборка
        run: npm run build
